<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Взлом">
<title>Доступ к системе</title>
<style>
  body { margin: 0; display: flex; height: 100vh; background: black; color: #0f0; font-family: monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
  
  /* Левая панель теперь делится на две части */
  #left-panel { width: 50%; display: flex; flex-direction: column; border-right: 2px solid #003300; box-sizing: border-box; }
  
  /* Верхняя часть для Матрицы */
  #matrix-container { flex: 1; overflow: hidden; position: relative; }
  #matrix-canvas { display: block; position: absolute; top: 0; left: 0; }
  
  /* Нижняя часть для текста */
  #terminal { height: 45%; padding: 20px; box-sizing: border-box; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-top: 1px dashed #003300; }
  
  /* Правая часть (сканер) */
  #scanner { width: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
  #touch-area { width: 400px; height: 400px; border: 2px dashed #0f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 28px; transition: all 0.3s; }
  .scanning #touch-area { background: rgba(0, 255, 0, 0.15); border-style: solid; box-shadow: 0 0 40px #0f0; transform: scale(0.95); }
  #status { margin-top: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>
  <div id="left-panel">
    <!-- Сюда добавлена Матрица -->
    <div id="matrix-container">
      <canvas id="matrix-canvas"></canvas>
    </div>
    <!-- Здесь логи -->
    <div id="terminal"></div>
  </div>
  
  <div id="scanner">
    <div id="touch-area">ПРИЛОЖИТЕ<br>5 ПАЛЬЦЕВ<br>И УДЕРЖИВАЙТЕ</div>
    <div id="status">Система заблокирована</div>
  </div>

  <script>
    const targetUrl = "https://akylman.org"; 

    // === 1. ГЕНЕРАЦИЯ ЛОГОВ (ТЕРМИНАЛ) ===
    const terminal = document.getElementById('terminal');
    const logs = ["Установка P2P соединения...", "Обход файрвола iOS...", "Дешифровка биометрии...", "Поиск уязвимостей...", "Перехват пакетов...", "Синхронизация серверов..."];
    
    setInterval(() => {
      const p = document.createElement('div');
      p.innerText = "root@system:~# " + logs[Math.floor(Math.random() * logs.length)] + " [OK]";
      terminal.appendChild(p);
      if (terminal.childNodes.length > 15) terminal.removeChild(terminal.firstChild);
    }, 250);

    // === 2. ЭФФЕКТ МАТРИЦЫ ===
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const matrixContainer = document.getElementById('matrix-container');

    let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
    const fontSize = 16;
    let drops = [];

    function resizeCanvas() {
      canvas.width = matrixContainer.clientWidth;
      canvas.height = matrixContainer.clientHeight;
      const columns = canvas.width / fontSize;
      drops = [];
      for(let x = 0; x < columns; x++) drops[x] = 1;
    }

    // Подстраиваем размер при загрузке
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#0F0'; 
      ctx.font = fontSize + 'px monospace';
      
      for(let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);

    // === 3. ЛОГИКА СКАНЕРА И СБРОС СОСТОЯНИЯ ===
    const touchArea = document.getElementById('touch-area');
    const status = document.getElementById('status');
    const scanner = document.getElementById('scanner');
    let scanTimer;
    let isRedirecting = false; 

    // Эта функция сбрасывает сканер, когда вы возвращаетесь в приложение
    function resetScanner() {
      clearInterval(scanTimer);
      isRedirecting = false;
      scanner.classList.remove('scanning');
      status.innerText = "Система заблокирована";
      status.style.color = "#0f0";
      status.style.textShadow = "none";
    }

    // Слушатели, чтобы сбрасывать кэшированное состояние браузера Safari
    window.addEventListener('pageshow', resetScanner);
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resetScanner();
    });

    function startScan(e) {
      e.preventDefault();
      if (isRedirecting) return; 
      
      if (e.touches && e.touches.length < 5) { 
        status.innerText = `Нужно 5 пальцев! (сейчас: ${e.touches.length})`;
        status.style.color = "red";
        scanner.classList.remove('scanning');
        return; 
      }
      
      scanner.classList.add('scanning');
      status.innerText = "Считывание биометрии...";
      status.style.color = "#0f0";
      
      let progress = 0;
      scanTimer = setInterval(() => {
        progress += 20;
        status.innerText = `Анализ: ${progress}%`;
        if (progress >= 100) {
          clearInterval(scanTimer);
          isRedirecting = true;
          status.innerText = "ДОСТУП РАЗРЕШЕН";
          status.style.color = "#fff";
          status.style.textShadow = "0 0 10px #0f0";
          setTimeout(() => { 
            window.location.href = targetUrl; 
          }, 1000);
        }
      }, 400);
    }

    function stopScan(e) {
      e.preventDefault();
      if (isRedirecting) return; 
      clearInterval(scanTimer);
      scanner.classList.remove('scanning');
      status.innerText = "Система заблокирована";
      status.style.color = "#0f0";
    }

    touchArea.addEventListener('touchstart', startScan, {passive: false});
    window.addEventListener('touchend', stopScan);
    window.addEventListener('touchcancel', stopScan);
  </script>
</body>
</html>
