<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Взлом">
<title>Доступ к системе</title>
<style>
  body { margin: 0; display: flex; height: 100vh; background: black; color: #0f0; font-family: monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
  
  #main-ui { display: flex; width: 100%; height: 100%; transition: opacity 0.3s; }
  
  #left-panel { width: 50%; display: flex; flex-direction: column; border-right: 2px solid #003300; box-sizing: border-box; }
  #matrix-container { flex: 1; overflow: hidden; position: relative; }
  #matrix-canvas { display: block; position: absolute; top: 0; left: 0; }
  #terminal { height: 45%; padding: 20px; box-sizing: border-box; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; border-top: 1px dashed #003300; }
  
  #scanner { width: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
  
  /* Стили для поля пароля */
  #password-box { margin-bottom: 40px; text-align: center; }
  #password-box div { font-size: 20px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px #0f0; }
  #pass-input {
    background: rgba(0, 50, 0, 0.2);
    border: 2px solid #0f0;
    color: #0f0;
    font-family: monospace;
    font-size: 32px;
    text-align: center;
    width: 220px;
    padding: 10px;
    outline: none;
    letter-spacing: 15px;
    border-radius: 5px;
    box-shadow: inset 0 0 10px #0f0;
    transition: all 0.3s;
  }
  #pass-input:focus { box-shadow: 0 0 20px #0f0, inset 0 0 15px #0f0; background: rgba(0, 80, 0, 0.4); }

  #touch-area { width: 350px; height: 350px; border: 2px dashed #0f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 28px; transition: all 0.3s; }
  .scanning #touch-area { background: rgba(0, 255, 0, 0.15); border-style: solid; box-shadow: 0 0 40px #0f0; transform: scale(0.95); }
  #status { margin-top: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; text-align: center; height: 30px; }

  #welcome-screen {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: black;
    color: #0f0;
    font-size: 80px;
    font-weight: bold;
    text-shadow: 0 0 30px #0f0;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 100;
  }
</style>
</head>
<body>
  <div id="main-ui">
    <div id="left-panel">
      <div id="matrix-container">
        <canvas id="matrix-canvas"></canvas>
      </div>
      <div id="terminal"></div>
    </div>
    
    <div id="scanner">
      <!-- Блок для ввода пароля -->
      <div id="password-box">
        <div>ВВЕДИТЕ 6-ЗНАЧНЫЙ КОД:</div>
        <input type="tel" id="pass-input" maxlength="6" autocomplete="off" placeholder="------">
      </div>

      <div id="touch-area">ПРИЛОЖИТЕ<br>5 ПАЛЬЦЕВ<br>И УДЕРЖИВАЙТЕ</div>
      <div id="status">Система заблокирована</div>
    </div>
  </div>

  <div id="welcome-screen">ДОБРО ПОЖАЛОВАТЬ</div>

  <script>
    // === НАСТРОЙКИ СЕКРЕТНОСТИ ===
    const targetUrl = "https://youtube.com"; 
    const SECRET_PASSWORD = "212170"; // <--- ЗАМЕНИТЕ ЭТИ 6 ЦИФР НА СВОЙ ПАРОЛЬ

    // === 1. ГЕНЕРАЦИЯ ЛОГОВ ===
    const terminal = document.getElementById('terminal');
    const logs = ["Установка P2P соединения...", "Обход файрвола iOS...", "Дешифровка биометрии...", "Поиск уязвимостей...", "Перехват пакетов...", "Синхронизация серверов..."];
    
    setInterval(() => {
      const p = document.createElement('div');
      p.innerText = "root@system:~# " + logs[Math.floor(Math.random() * logs.length)] + " [OK]";
      terminal.appendChild(p);
      if (terminal.childNodes.length > 15) terminal.removeChild(terminal.firstChild);
    }, 250);

    // === 2. ЭФФЕКТ МАТРИЦЫ ===
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const matrixContainer = document.getElementById('matrix-container');

    let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'.split('');
    const fontSize = 16;
    let drops = [];

    function resizeCanvas() {
      canvas.width = matrixContainer.clientWidth;
      canvas.height = matrixContainer.clientHeight;
      const columns = canvas.width / fontSize;
      drops = [];
      for(let x = 0; x < columns; x++) drops[x] = 1;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0F0'; 
      ctx.font = fontSize + 'px monospace';
      
      for(let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);

    // === 3. ЛОГИКА СКАНЕРА И ПАРОЛЯ ===
    const touchArea = document.getElementById('touch-area');
    const status = document.getElementById('status');
    const scanner = document.getElementById('scanner');
    const mainUi = document.getElementById('main-ui');
    const welcomeScreen = document.getElementById('welcome-screen');
    const passInput = document.getElementById('pass-input');
    
    let scanTimer;
    let isRedirecting = false; 
    let voiceUnlocked = false; 

    function resetScanner() {
      clearInterval(scanTimer);
      isRedirecting = false;
      scanner.classList.remove('scanning');
      status.innerText = "Система заблокирована";
      status.style.color = "#0f0";
      passInput.value = ""; // Очищаем пароль при сбросе
      mainUi.style.display = "flex";
      welcomeScreen.style.display = "none";
    }

    window.addEventListener('pageshow', resetScanner);
    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resetScanner();
    });

    function startScan(e) {
      e.preventDefault();
      if (isRedirecting) return; 

      // Прячем клавиатуру iPad, если она открыта, чтобы не мешала сканированию
      passInput.blur();

      // Проверка голоса
      if (!voiceUnlocked) {
        let unlockMsg = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(unlockMsg);
        voiceUnlocked = true;
      }

      // ПРОВЕРКА ПАРОЛЯ
      if (passInput.value !== SECRET_PASSWORD) {
        status.innerText = "ОШИБКА: НЕВЕРНЫЙ КОД";
        status.style.color = "red";
        passInput.style.borderColor = "red";
        passInput.style.boxShadow = "inset 0 0 10px red";
        setTimeout(() => {
          passInput.style.borderColor = "#0f0";
          passInput.style.boxShadow = "inset 0 0 10px #0f0";
        }, 1500);
        return;
      }
      
      // ПРОВЕРКА 5 ПАЛЬЦЕВ
      if (e.touches && e.touches.length < 5) { 
        status.innerText = `Нужно 5 пальцев! (сейчас: ${e.touches.length})`;
        status.style.color = "red";
        scanner.classList.remove('scanning');
        return; 
      }
      
      scanner.classList.add('scanning');
      status.innerText = "Считывание биометрии...";
      status.style.color = "#0f0";
      
      let progress = 0;
      scanTimer = setInterval(() => {
        progress += 20;
        status.innerText = `Анализ: ${progress}%`;
        
        if (progress >= 100) {
          clearInterval(scanTimer);
          isRedirecting = true;
          
          mainUi.style.display = "none";
          welcomeScreen.style.display = "flex";
          
          let utterance = new SpeechSynthesisUtterance("Добро пожаловать в систему, мистер Исанур");
          utterance.lang = "ru-RU";
          utterance.rate = 0.9;
          utterance.pitch = 0.8;
          window.speechSynthesis.speak(utterance);

          setTimeout(() => { 
            window.location.href = targetUrl; 
          }, 3500);
        }
      }, 400);
    }

    function stopScan(e) {
      e.preventDefault();
      if (isRedirecting) return; 
      clearInterval(scanTimer);
      scanner.classList.remove('scanning');
      
      if (passInput.value !== SECRET_PASSWORD) {
        status.innerText = "Система заблокирована";
      } else {
        status.innerText = "Сканирование прервано";
      }
      status.style.color = "#0f0";
    }

    touchArea.addEventListener('touchstart', startScan, {passive: false});
    window.addEventListener('touchend', stopScan);
    window.addEventListener('touchcancel', stopScan);
  </script>
</body>
</html>
